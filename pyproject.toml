[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blurlabs"
version = "0.1.0"
description = "Blur Labs open imaging models: Reconstruct Anything Models (RAM) for computational imaging."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Blur Labs" }]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "deepinv @ git+https://github.com/deepinv/deepinv.git@main",
    "huggingface_hub",
]
keywords = ["computational imaging", "inverse problems", "image reconstruction", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["ptwt", "sigpy"]
test = ["pytest"]

[project.urls]
Homepage = "https://www.blurlabs.ai/"
Source = "https://github.com/BlurLabsAI/blurlabs"
Weights = "https://huggingface.co/blurlabs/ram2"

[tool.setuptools.packages.find]
include = ["blurlabs*"]
exclude = ["blurlabs.tests*"]
